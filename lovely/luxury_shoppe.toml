[manifest]
version = "1.0.0"
dump_lua = true
priority = 500

# Add dynamic colour
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''elseif G.GAME.blind then 
        G.GAME.blind:change_colour()'''
position = "after"
payload =  '''elseif state == G.STATES.RGMC_LUXURY_SHOPPE then 
    ease_colour(G.C.DYN_UI.MAIN, G.C.GOLD)'''
overwrite = true
match_indent = true

# Add background
[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''elseif state == G.STATES.PLANET_PACK then
        ease_background_colour{new_colour = G.C.BLACK, contrast = 3}'''
position = 'after'
payload = '''elseif state == G.STATES.RGMC_LUXURY_SHOPPE then
		ease_background_colour{new_colour = G.C.BLACK, contrast = 3}'''
match_indent = true


# Edit next round button in Shop
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''{n=G.UIT.R,config={id = 'next_round_button', align = "cm", minw = 2.8, minh = 1.5, r=0.15,colour = G.C.RED, one_press = true, button = 'toggle_shop', hover = true,shadow = true}, nodes = {
                          {n=G.UIT.R, config={align = "cm", padding = 0.07, focus_args = {button = 'y', orientation = 'cr'}, func = 'set_button_pip'}, nodes={
                            {n=G.UIT.R, config={align = "cm", maxw = 1.3}, nodes={
                              {n=G.UIT.T, config={text = localize('b_next_round_1'), scale = 0.4, colour = G.C.WHITE, shadow = true}}
                            }},
                            {n=G.UIT.R, config={align = "cm", maxw = 1.3}, nodes={
                              {n=G.UIT.T, config={text = localize('b_next_round_2'), scale = 0.4, colour = G.C.WHITE, shadow = true}}
                            }}   
                          }},              
                        }},'''
position = "at"
payload =  '''Madcap.Funcs.get_next_round_button(),'''
overwrite = true
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''if self.STATE == self.STATES.PLANET_PACK then
            self:update_celestial_pack(dt)
        end
'''
position = "after"
payload =  '''

if self.STATE == self.STATES.RGMC_LUXURY_SHOPPE then
    self:update_luxury_shoppe(dt)
end'''
overwrite = true
match_indent = true