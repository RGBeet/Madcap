                {n=G.UIT.O, config={object = DynaText({string = {{ref_table = G.GAME, ref_value = 'temporary_discards'}}, font = G.LANGUAGES['en-us'].font, colours = {darken(G.C.RED,0.2)},shadow = true, rotate = true, scale = scale}),id = 'temp_discard_UI_count'}},
                {n=G.UIT.T, config={text = ')', scale = scale, colour = darken(G.C.UI.TEXT_LIGHT,0.3), shadow = true}}
            }}'''
