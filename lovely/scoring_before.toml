[manifest]
version = "1.0.0"
dump_lua = true
priority = -10000

[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = '''local text,disp_text,apoker_hands = G.FUNCS.get_poker_hand_info(self.highlighted)'''
position = "at"
payload = '''local text,disp_text,poker_hands = G.FUNCS.get_poker_hand_info(self.highlighted)'''
match_indent = true

[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = """                update_hand_text({immediate = true, nopulse = nil, delay = 0}, {handname=disp_text, level=G.GAME.hands[text].level, mult = G.GAME.hands[text].mult, chips = G.GAME.hands[text].chips})"""
position = "before"
payload = """
if Madcap.Funcs.hand_display_mod(self.highlighted,text,disp_text,poker_hands,scoring_hand) then
else
"""
overwrite = true
match_indent = true
