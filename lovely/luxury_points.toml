[manifest]
version = "1.0.0"
dump_lua = true
priority = -10000

# Replaces the UI if the card uses LUXURY POINTS
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''local t1 = {
              n=G.UIT.ROOT, config = {minw = 0.6, align = 'tm', colour = darken(G.C.BLACK, 0.2), shadow = true, r = 0.05, padding = 0.05, minh = 1}, nodes={
                  {n=G.UIT.R, config={align = "cm", colour = lighten(G.C.BLACK, 0.1), r = 0.1, minw = 1, minh = 0.55, emboss = 0.05, padding = 0.03}, nodes={
                    {n=G.UIT.O, config={object = DynaText({string = {{prefix = localize('$'), ref_table = card, ref_value = 'cost'}}, colours = {G.C.MONEY},shadow = true, silent = true, bump = true, pop_in = 0, scale = 0.5})}},
                  }}
              }}'''
position = "at"
match_indent = true
payload = '''local t1 = Madcap.Funcs.edit_shop_ui_t1(card)'''

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''local t2 = card.ability.set == 'Voucher' and {
            n=G.UIT.ROOT, config = {ref_table = card, minw = 1.1, maxw = 1.3, padding = 0.1, align = 'bm', colour = G.C.GREEN, shadow = true, r = 0.08, minh = 0.94, func = 'can_redeem', one_press = true, button = 'redeem_from_shop', hover = true}, nodes={
                {n=G.UIT.T, config={text = localize('b_redeem'),colour = G.C.WHITE, scale = 0.4}}
            }} or card.ability.set == 'Booster' and {
            n=G.UIT.ROOT, config = {ref_table = card, minw = 1.1, maxw = 1.3, padding = 0.1, align = 'bm', colour = G.C.GREEN, shadow = true, r = 0.08, minh = 0.94, func = 'can_open', one_press = true, button = 'open_booster', hover = true}, nodes={
                {n=G.UIT.T, config={text = localize('b_open'),colour = G.C.WHITE, scale = 0.5}}
            }} or {
            n=G.UIT.ROOT, config = {ref_table = card, minw = 1.1, maxw = 1.3, padding = 0.1, align = 'bm', colour = G.C.GOLD, shadow = true, r = 0.08, minh = 0.94, func = 'can_buy', one_press = true, button = 'buy_from_shop', hover = true}, nodes={
                {n=G.UIT.T, config={text = localize('b_buy'),colour = G.C.WHITE, scale = 0.5}}
            }}'''
position = "at"
match_indent = true
payload = '''local t2 = Madcap.Funcs.edit_shop_ui_t2(card)'''

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''local t3 = {
            n=G.UIT.ROOT, config = {id = 'buy_and_use', ref_table = card, minh = 1.1, padding = 0.1, align = 'cr', colour = G.C.RED, shadow = true, r = 0.08, minw = 1.1, func = 'can_buy_and_use', one_press = true, button = 'buy_from_shop', hover = true, focus_args = {type = 'none'}}, nodes={
              {n=G.UIT.B, config = {w=0.1,h=0.6}},
              {n=G.UIT.C, config = {align = 'cm'}, nodes={
                {n=G.UIT.R, config = {align = 'cm', maxw = 1}, nodes={
                  {n=G.UIT.T, config={text = localize('b_buy'),colour = G.C.WHITE, scale = 0.5}}
                }},
                {n=G.UIT.R, config = {align = 'cm', maxw = 1}, nodes={
                  {n=G.UIT.T, config={text = localize('b_and_use'),colour = G.C.WHITE, scale = 0.3}}
                }},
              }} 
            }}'''
position = "at"
match_indent = true
payload = '''local t3 = Madcap.Funcs.edit_shop_ui_t3(card)'''

# Boosters
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''if self.cost > 0 then 
            G.E_MANAGER:add_event(Event({trigger = 'after', delay = 0.2, func = function()
                inc_career_stat('c_shop_dollars_spent', self.cost)
                self:juice_up()
            return true end }))
            ease_dollars(-self.cost) 
       else
           delay(0.2)
       end'''
position = "at"
match_indent = true
payload = '''Madcap.Funcs.handle_booster_cost(self)'''

# Vouchers?
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''if self.cost ~= 0 then
            ease_dollars(-self.cost)
            inc_career_stat('c_shop_dollars_spent', self.cost)
        end'''
position = "at"
match_indent = true
payload = '''Madcap.Funcs.handle_voucher_cost(self)'''

# Ease luxury points - two patches, one if Paya is installed
[[patches]]
[patches.pattern]
target = 'functions/button_callbacks.lua'
pattern = '''if c1.config and c1.config.center and c1.config.center.pyroxenes then
	ease_pyrox(-c1.config.center.pyroxenes)'''
position = 'after'
payload = '''
elseif Madcap.Funcs.uses_lp(c1) then
	ease_lp(c1:calc_lp() * -1)
'''
match_indent = true

# Buy with LP
[[patches]]
[patches.pattern]
target = 'functions/button_callbacks.lua'
pattern = '''if c1.cost ~= 0 then'''
position = 'at'
payload = '''
if Madcap.Funcs.uses_lp(c1) then
	ease_lp(c1:calc_lp() * -1)
elseif c1.cost ~= 0 then
'''
match_indent = true

# Checks whether it has LP or $
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''G.CONTROLLER:save_cardarea_focus(area == G.jokers and 'jokers' or 'consumeables')'''
position = 'after'
payload = '''local is_luxury = Madcap.Funcs.uses_lp(self)'''
match_indent = true

# Gain LP from selling
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''ease_dollars(self.sell_cost)'''
position = 'at'
payload = '''if is_luxury then
  ease_lp(self:calc_lp())
else
  ease_dollars(self.sell_cost)
end'''
match_indent = true
times = 2