[manifest]
version = "1.0.0"
dump_lua = true
priority = 1000

# Luxury Pts - add at top of eval
[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''local num_dollars = config.dollars or 1'''
position = 'after'
payload = '''
local num_lp = config.rgmc_lp or 0
if not config.dollars and num_lp > 0 then num_dollars = 0 end
'''
match_indent = true
times = 1

# Luxury Pts - add during eval
[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''local dollar_row = 0'''
position = 'before'
payload = '''
local lp_row, lp_pitch = 0, 1.0
if num_lp > 20 then
	MadLib.event({
		trigger = 'before',
		delay = 0.38,
		func = function()
			G.round_eval:add_child(
				{
					n = G.UIT.R,
					config = { align = "cm", id = 'lp_row' .. (lp_row + 1) .. '_' .. config.name },
					nodes = {
						{ n = G.UIT.O, config = { object = DynaText({ string = { '£' .. num_lp }, colours = { G.C.RED }, shadow = true, pop_in = 0, scale = 0.65, float = true }) } }
					}
				},
				G.round_eval:get_UIE_by_ID('dollar_' .. config.name))

			play_sound('coin3', 0.9 + 0.2 * math.random(), 0.7)
			play_sound('rgmc_kaching', 1, 0.8)
			return true
		end
	})
elseif num_lp > 0 then
	for i = 1, num_lp or 1 do
		G.E_MANAGER:add_event(Event({
			trigger = 'before',
			delay = 0.18 - ((num_lp > 20 and 0.13) or (num_lp > 9 and 0.1) or 0),
			func = function()
				if i % 30 == 1 then
					G.round_eval:add_child(
						{ n = G.UIT.R, config = { align = "cm", id = 'lp_row_' .. (lp_row + 1) .. '_' .. config.name }, nodes = {} },
						G.round_eval:get_UIE_by_ID('dollar_' .. config.name))
					  lp_row = lp_row + 1
				end
				local r = { n = G.UIT.T, config = { text = '£', colour = G.C.RED, scale = ((num_lp > 20 and 0.28) or (num_lp > 9 and 0.43) or 0.58), shadow = true, hover = true, can_collide = false, juice = true } }
				play_sound('coin3', 0.9 + 0.2 * math.random(), 0.7 - (num_lp > 20 and 0.2 or 0))
                play_sound('rgmc_kaching_short', 0.09 + lp_pitch)
                lp_pitch = lp_pitch + 0.03
				G.round_eval:add_child(r, G.round_eval:get_UIE_by_ID('lp_row_' .. (lp_row) .. '_' .. config.name))
				G.VIBRATION = G.VIBRATION + 0.4
				return true
			end
		}))
	end
end
'''
match_indent = true
times = 1

# Luxury Pts - bottom
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''add_round_eval_row({name = 'bottom', dollars = dollars})'''
position = 'at'
payload = '''add_round_eval_row({
    name = 'bottom', 
    dollars = dollars, 
    rgmc_lp = rgmc_lp, 
})'''
match_indent = true
times = 1

# Adds custom cashouts
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''add_round_eval_row({name = 'bottom', pitch = pitch, dollars = dollars})'''
position = 'before'
payload = '''for k,v in pairs(Madcap.CustomCashouts) do
	if v.check() then
		local cash_money = (v.get_money and v.get_money() or v.money or 0)
		add_round_eval_row({name = k, dollars = cash_money})
		pitch = pitch + (v.pitch_up or 0.06)
		dollars = dollars + cash_money
	end
end'''
match_indent = true

# Adds custom cashouts
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''if ret then
            add_round_eval_row({dollars = ret.dollars, bonus = true, name='tag'..i, pitch = pitch, condition = ret.condition, pos = ret.pos, tag = ret.tag})
            pitch = pitch + 0.06
            dollars = dollars + ret.dollars
        end'''
position = 'after'
payload = '''ret = G.GAME.tags[i]:apply_to_run({type = 'eval_luxury'})
if ret then
    add_round_eval_row({rgmc_lp = ret.rgmc_lp, bonus = true, name='tag'..i, pitch = pitch, condition = ret.condition, pos = ret.pos, tag = ret.tag})
    pitch = pitch + 0.06
    rgmc_lp = MadLib.add(rgmc_lp, ret.rgmc_lp or 0)
end'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''if ret then
                i = i+1
                add_round_eval_row({dollars = ret, bonus = true, name='joker'..i, pitch = pitch, card = _card})
                pitch = pitch + 0.06
                dollars = dollars + ret
            end'''
position = "after"
payload = '''
ret = _card:calculate_luxury_bonus()
if ret then
    i = i+1
    add_round_eval_row({rgmc_lp = ret, bonus = true, name='joker'..i..'_luxe', pitch = pitch, card = _card})
    pitch = pitch + 0.06
    rgmc_lp = rgmc_lp + ret
end'''
match_indent = true


[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''if G.GAME.current_round.discards_left > 0 and G.GAME.modifiers.money_per_discard then
        add_round_eval_row({dollars = G.GAME.current_round.discards_left*(G.GAME.modifiers.money_per_discard), disp = G.GAME.current_round.discards_left, bonus = true, name='discards', pitch = pitch})
        pitch = pitch + 0.06
        dollars = dollars +  G.GAME.current_round.discards_left*(G.GAME.modifiers.money_per_discard)
    end'''
position = 'after'
payload = '''if G.GAME.modifiers.boss_luxury_points and G.GAME.blind.boss then
    add_round_eval_row({rgmc_lp = G.GAME.modifiers.boss_luxury_points, bonus = true, name = 'luxury_bonus', pitch = pitch})
    pitch 	= pitch + 0.06
	rgmc_lp = rgmc_lp + G.GAME.modifiers.boss_luxury_points
end'''
match_indent = true
times = 1


[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''local dollars = 0'''
position = 'after'
payload = '''local rgmc_lp = 0'''
match_indent = true

# Luxury Pts - add at top of eval
[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''elseif config.name == 'discards' then'''
position = 'before'
payload = '''elseif config.name == 'luxury_reward' then
	table.insert(left_text, {n=G.UIT.T, config={text = config.disp or config.rgmc_lp, scale = 0.8*scale, colour = G.C.RGMC_LUXURY, shadow = true, juice = true}})
    table.insert(left_text, {n=G.UIT.O, config={object = DynaText({string = {" "..localize{type = 'variable', condition = localize('ph_luxury_bonus'), key = 'luxury_bonus', vars = {G.GAME.modifiers.boss_luxury_points or 5}}}, colours = {G.C.UI.TEXT_LIGHT}, shadow = true, pop_in = 0, scale = 0.4*scale, silent = true})}})'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''local luxury_pitch = 1.0'''
position = 'after'
payload = '''--print('LUXURY PTS: '..number_format(num_lp))'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''definition = {n=G.UIT.ROOT, config={align = 'cm', colour = G.C.CLEAR}, nodes={
                        {n=G.UIT.R, config={id = 'cash_out_button', align = "cm", padding = 0.1, minw = 7, r = 0.15, colour = G.C.ORANGE, shadow = true, hover = true, one_press = true, button = 'cash_out', focus_args = {snap_to = true}}, nodes={
                            {n=G.UIT.T, config={text = localize('b_cash_out')..": ", scale = 1, colour = G.C.UI.TEXT_LIGHT, shadow = true}},
                            {n=G.UIT.T, config={text = localize('$')..format_ui_value(config.dollars), scale = 1.2*scale, colour = G.C.WHITE, shadow = true, juice = true}}
                    }},}},'''
position = "at"
payload = '''definition = Madcap.Funcs.get_cash_out_definition(config, scale),'''
match_indent = true
overwrite = false

# Finally add the LP at the very end.
[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''G.GAME.current_round.dollars = config.dollars'''
position = 'after'
payload = '''G.GAME.current_round.rgmc_lp = config.rgmc_lp'''
match_indent = true


    

